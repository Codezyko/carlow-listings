    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markers = [];

function clearMarkers() {
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];
}

function addMarkers() {
    clearMarkers();

    const maxPrice = Number(document.getElementById("priceSlider").value);
    const bedsFilter = document.getElementById("bedsFilter").value;
    const typeFilter = document.getElementById("typeFilter").value;
    const sharedFilter = document.getElementById("sharedFilter").value;

    document.getElementById("priceValue").innerText = maxPrice;

    let shown = 0;

    listings.forEach(item => {
        if (item.price > maxPrice) return;
        if (bedsFilter !== "all" && String(item.beds) !== bedsFilter) return;
        if (typeFilter !== "all" && item.type !== typeFilter) return;
        if (sharedFilter !== "all" && item.shared !== sharedFilter) return;

        const popup = `
            <b>${item.address}</b><br>
            €${item.price} / month<br>
            Beds: ${item.beds}<br>
            Baths: ${item.baths}<br>
            Type: ${item.type}<br>
            Shared: ${item.shared}<br>
            <a href="${item.link}" target="_blank">Open Listing</a>
        `;

        const marker = L.marker([item.lat, item.lon])
            .bindPopup(popup)
            .bindTooltip(item.address);

        marker.addTo(map);
        markers.push(marker);
        shown++;
    });

    document.getElementById("resultCount").innerText = shown;
}

document.getElementById("priceSlider").addEventListener("input", addMarkers);
document.getElementById("bedsFilter").addEventListener("change", addMarkers);
document.getElementById("typeFilter").addEventListener("change", addMarkers);
document.getElementById("sharedFilter").addEventListener("change", addMarkers);

addMarkers();
</script>

</body>
</html>
